[[packages]]
name = "libtacplus-map"
commit_id = "rolling"
scm_url = "https://github.com/vyos/libtacplus-map.git"
build_cmd = "dpkg-buildpackage -us -uc -tc -b"

[[packages]]
name = "libpam-tacplus"
commit_id = "rolling"
scm_url = "https://github.com/vyos/libpam-tacplus.git"
# Install locally-built libtacplus-map before build.py's generic mk-build-deps
# step (debian/control requires libtacplus-map-dev, not in the apt repo).
pre_build_hook = "sudo dpkg -i ../libtacplus-map*.deb"
build_cmd = "dpkg-buildpackage -us -uc -tc -b"

[[packages]]
name = "libnss-tacplus"
commit_id = "rolling"
scm_url = "https://github.com/vyos/libnss-tacplus.git"
pre_build_hook = "sudo dpkg -i ../libtac*.deb ../libpam-tacplus*.deb"
build_cmd = "dpkg-buildpackage -us -uc -tc -b"

[dependencies]
packages = [
    "libpam-dev",
    "libssl-dev",
    "autoconf-archive",
    "libaudit-dev"
]
